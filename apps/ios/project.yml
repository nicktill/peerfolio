name: Peerfolio
options:
  bundleIdPrefix: org.peerfolio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Set your team once here (or in Xcode > Signing & Capabilities). Nothing else in the repo needs it.
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""            # e.g. ABCDE12345
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PEERFOLIO_BASE_URL: "https://www.peerfolio.org"
    # Debug builds can point at a local `npm run dev` (use your Mac's LAN address on a real device).
  configs:
    Debug:
      PEERFOLIO_BASE_URL: "http://localhost:3000"

packages:
  PeerfolioKit:
    path: PeerfolioKit
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  Peerfolio:
    type: application
    platform: iOS
    sources:
      - path: Peerfolio
    dependencies:
      - package: PeerfolioKit
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: Peerfolio/Resources/Peerfolio.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Peerfolio/Resources/Info.plist
      properties:
        CFBundleDisplayName: Peerfolio
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts:
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - Newsreader-Regular.ttf
          - Newsreader-Italic.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
        PeerfolioBaseURL: "$(PEERFOLIO_BASE_URL)"
        ITSAppUsesNonExemptEncryption: false
        # Google sign-in: iOS OAuth client id and its reversed form as a URL scheme (from Google Cloud Console).
        GIDClientID: "$(GOOGLE_IOS_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["$(GOOGLE_IOS_REVERSED_CLIENT_ID)"]
        # Debug only: allow http://localhost. Release uses HTTPS everywhere.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.peerfolio.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GOOGLE_IOS_CLIENT_ID: ""             # set in Config/Secrets.xcconfig or here
        GOOGLE_IOS_REVERSED_CLIENT_ID: "com.googleusercontent.apps.REPLACE_ME"

  PeerfolioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PeerfolioTests]
    dependencies:
      - target: Peerfolio

schemes:
  Peerfolio:
    build:
      targets:
        Peerfolio: all
    test:
      targets: [PeerfolioTests]
