name: Plaid persistence regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plaid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: plaid-test
          POSTGRES_DB: plaid_test
        ports: [55433:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:plaid-sync --workspace=@repo/web
        env:
          PLAID_TEST_DATABASE_URL: postgresql://postgres:plaid-test@127.0.0.1:55433/plaid_test
