name: Plaid persistence regressions
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "design/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "design/**"]
# A newer push to the same branch or PR supersedes the run in flight (saves Actions minutes once the repository is private).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  plaid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: plaid-test
          POSTGRES_DB: plaid_test
        # Tests connect from the runner host; keep the published port local to it.
        ports: ["127.0.0.1:55433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:plaid-sync --workspace=@repo/web
        env:
          PLAID_TEST_DATABASE_URL: postgresql://postgres:plaid-test@127.0.0.1:55433/plaid_test
