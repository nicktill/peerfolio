name: Import regression checks
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "design/**"]
  workflow_dispatch: {}
# Superseded PR revisions need not consume private-repository Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: regression
          POSTGRES_DB: regression
        # Tests connect from the runner host; keep the published port local to it.
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The Plaid suite intentionally enforces its dedicated disposable database URL.
      plaid-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: plaid-test
          POSTGRES_DB: plaid_test
        ports: ["127.0.0.1:55433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test --prefix infra/cron-worker
      - run: npm test --workspace @repo/web
        env:
          PEERFOLIO_TEST_PG_URL: postgres://postgres:regression@127.0.0.1:5432/regression
      - run: npm run check-types --workspace @repo/web
      - run: node apps/web/scripts/import-regression.mjs
        env:
          IMPORT_TEST_DATABASE_URL: postgres://postgres:regression@127.0.0.1:5432/regression
      - run: node apps/web/scripts/close-regression.mjs
        env:
          IMPORT_TEST_DATABASE_URL: postgres://postgres:regression@127.0.0.1:5432/regression
      # Both full suites share checkout, Node setup and the dependency installation.
      - run: npm run test:plaid-sync --workspace=@repo/web
        env:
          PLAID_TEST_DATABASE_URL: postgresql://postgres:plaid-test@127.0.0.1:55433/plaid_test
