name: Import regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  imports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: regression
          POSTGRES_DB: regression
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test --workspace @repo/web
      - run: npm run check-types --workspace @repo/web
      - run: npm run test:news --workspace @repo/web
      - run: node apps/web/scripts/import-regression.mjs
        env:
          IMPORT_TEST_DATABASE_URL: postgres://postgres:regression@127.0.0.1:5432/regression
      - run: node apps/web/scripts/close-regression.mjs
        env:
          IMPORT_TEST_DATABASE_URL: postgres://postgres:regression@127.0.0.1:5432/regression
