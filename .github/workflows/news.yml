name: News recap

# Backup for the News page. Page visits already refresh headlines and write any
# recap that's due; these runs make sure it happens on quiet days too. The job
# decides what's due from the New York clock, so extra or late runs are harmless.
# Times are UTC; each pair covers daylight saving and standard time.
on:
  schedule:
    - cron: "0 11,12 * * 1-5" # 7:00am ET pre-market, EDT/EST pair
    - cron: "15 14,15 * * 1-5" # 10:15am ET opening update
    - cron: "0 16,17 * * 1-5" # noon ET
    - cron: "15 18,19 * * 1-5" # 2:15pm ET afternoon update
    - cron: "30 20,21 * * 1-5" # 4:30pm ET closing recap (due at close + 20; :30 shares the quarter-hour database wake)
    - cron: "30 17,18 * * 1-5" # 1:30pm ET early-close backup; otherwise no new slot
  workflow_dispatch: {}

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/cron/news
        env:
          APP_URL: ${{ vars.PEERFOLIO_URL || 'https://www.peerfolio.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Set the CRON_SECRET repository secret." >&2
            exit 1
          fi
          code=$(curl --silent --show-error --max-time 300 \
            -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/news")
          cat response.json
          echo
          [ "$code" = "200" ] || { echo "Expected HTTP 200, got $code" >&2; exit 1; }
