name: Sports cron

# Cloudflare owns automatic publish/settle scheduling. This workflow is manual recovery/diagnostics only.
on:
  workflow_dispatch:
    inputs:
      job:
        description: publish, settle or latency
        default: publish

concurrency:
  group: sports-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.job == 'publish' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/sports/publish
        env:
          APP_URL: ${{ vars.PEERFOLIO_URL || 'https://www.peerfolio.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "Set the CRON_SECRET repository secret." >&2; exit 1; }
          code=$(curl --silent --show-error --max-time 120 --retry 2 --retry-delay 10 \
            -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/sports/publish")
          cat response.json; echo
          [ "$code" = "200" ] || { echo "Expected HTTP 200, got $code" >&2; exit 1; }

  settle:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.job == 'settle' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/sports/settle
        env:
          APP_URL: ${{ vars.PEERFOLIO_URL || 'https://www.peerfolio.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$CRON_SECRET" ] || { echo "Set the CRON_SECRET repository secret." >&2; exit 1; }
          code=$(curl --silent --show-error --max-time 120 --retry 2 --retry-delay 10 \
            -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/sports/settle")
          cat response.json; echo
          [ "$code" = "200" ] || { echo "Expected HTTP 200, got $code" >&2; exit 1; }

  # Read-only measurement of ESPN (no app, no keys, no credits). Polls every 30 s for about 4.5 minutes on
  # each run and uploads the transitions it saw; state carries over between runs through the cache so a
  # game's pre -> in -> post is timed even when runs are late. Enabled by SPORTS_LATENCY_ENABLED.
  latency:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.job == 'latency' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore last seen states
        uses: actions/cache/restore@v4
        with:
          path: latency-state.json
          key: espn-latency-state-${{ github.run_id }}
          restore-keys: espn-latency-state-
      - name: Poll ESPN scoreboards
        run: node apps/web/scripts/espn-latency.mjs --loop 30 --for 270
      - name: Save last seen states
        if: always()
        uses: actions/cache/save@v4
        with:
          path: latency-state.json
          key: espn-latency-state-${{ github.run_id }}
      - name: Upload transitions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-latency-${{ github.run_id }}
          path: latency.jsonl
          if-no-files-found: ignore
          retention-days: 14
