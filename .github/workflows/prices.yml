name: Refresh prices

# Vercel's free plan only allows one cron run a day, so GitHub calls the app's
# price endpoint instead. Times are UTC; the market window is 9:30-16:00 ET
# whether or not daylight saving is on. Runs can be a few minutes late.
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5" # market hours: live quotes every 5 minutes (between visits)
    - cron: "5,15,25,35,45,55 22-23 * * 1-5" # after the close: pick up the official close
    - cron: "5,15,25,35,45,55 0-1 * * 2-6" #   (still the same evening in US time)
    - cron: "15 10 * * 2-6" # early morning safety net for the previous close
  workflow_dispatch: {}

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/prices
        env:
          APP_URL: ${{ vars.PEERFOLIO_URL || 'https://www.peerfolio.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Set the CRON_SECRET repository secret." >&2
            exit 1
          fi
          # Anything but a 200 fails the run. A redirect (the bare domain redirects to www)
          # would otherwise look like success without the app ever being reached.
          code=$(curl --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/prices")
          cat response.json
          echo
          [ "$code" = "200" ] || { echo "Expected HTTP 200, got $code" >&2; exit 1; }

      # The News page's market cards take 15 quotes from a rate-limited provider,
      # so whoever opens the page right after the cache expires waits for them.
      # Asking here, on the schedule, means a visitor finds them already fetched.
      # `warm` only skips the CDN copy; the page's own cache is what gets filled.
      # A failure here never fails the run: it only means the next visitor waits.
      - name: Warm the News page
        if: always()
        continue-on-error: true
        env:
          APP_URL: ${{ vars.PEERFOLIO_URL || 'https://www.peerfolio.org' }}
        run: |
          stamp=$(date +%s)
          for part in board earnings fear-greed; do
            curl --silent --show-error --max-time 75 -o /dev/null \
              -w "$part: HTTP %{http_code} in %{time_total}s\n" \
              "${APP_URL%/}/api/news/market?part=$part&warm=$stamp" &
          done
          curl --silent --show-error --max-time 75 -o /dev/null \
            -w "news: HTTP %{http_code} in %{time_total}s\n" \
            "${APP_URL%/}/api/news?warm=$stamp" &
          wait
