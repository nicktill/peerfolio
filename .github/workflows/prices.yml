name: Refresh prices

# Vercel's free plan only allows one cron run a day, so GitHub calls the app's
# price endpoint instead. GitHub's cron is UTC and knows nothing of daylight
# saving, so these times are a superset of the New York windows with work to do
# (live 9:30-16:05, close capture 16:30-20:00, fund NAVs 19:00-23:00, the 6:15
# morning pass); the route itself checks the New York clock and answers at once
# outside them. Runs can be a few minutes late.
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5" # market hours: live quotes every 5 minutes (between visits); also the 10-minute close checks at 16:30-17:30 ET
    - cron: "*/10 22 * * 1-5" # after the close, winter: still within the early close checks
    - cron: "5 23 * * 1-5" # evening: hourly fund NAVs and the 2-hourly close retries (summer 19:00-23:00 ET = 23:00-03:00 UTC)
    - cron: "5 0-4 * * 2-6" #   (the same evening in US time; winter ends at 04:00 UTC)
    - cron: "15 10,11 * * *" # 6:15am New York, every day: 10:15 UTC in summer, 11:15 in winter
  workflow_dispatch: {}

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/prices
        env:
          APP_URL: ${{ vars.PEERFOLIO_URL || 'https://www.peerfolio.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Set the CRON_SECRET repository secret." >&2
            exit 1
          fi
          # Anything but a 200 fails the run. A redirect (the bare domain redirects to www)
          # would otherwise look like success without the app ever being reached.
          code=$(curl --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/prices")
          cat response.json
          echo
          [ "$code" = "200" ] || { echo "Expected HTTP 200, got $code" >&2; exit 1; }

      # The News page's market cards take 15 quotes from a rate-limited provider,
      # so whoever opens the page right after the cache expires waits for them.
      # Asking here, on the schedule, means a visitor finds them already fetched.
      # `warm` only skips the CDN copy; the page's own cache is what gets filled.
      # A failure here never fails the run: it only means the next visitor waits.
      - name: Warm the News page
        if: always()
        continue-on-error: true
        env:
          APP_URL: ${{ vars.PEERFOLIO_URL || 'https://www.peerfolio.org' }}
        run: |
          # Market hours only (New York clock, weekdays 9:30-16:05); the cards don't change outside them.
          dow=$(TZ=America/New_York date +%u)
          hm=$((10#$(TZ=America/New_York date +%H%M)))
          if [ "$dow" -gt 5 ] || [ "$hm" -lt 930 ] || [ "$hm" -gt 1605 ]; then
            echo "Market closed: nothing to warm."
            exit 0
          fi
          stamp=$(date +%s)
          for part in board earnings fear-greed; do
            curl --silent --show-error --max-time 75 -o /dev/null \
              -w "$part: HTTP %{http_code} in %{time_total}s\n" \
              "${APP_URL%/}/api/news/market?part=$part&warm=$stamp" &
          done
          curl --silent --show-error --max-time 75 -o /dev/null \
            -w "news: HTTP %{http_code} in %{time_total}s\n" \
            "${APP_URL%/}/api/news?warm=$stamp" &
          wait
