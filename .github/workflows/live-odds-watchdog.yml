name: Live odds watchdog

# The scheduled check now runs in the Cloudflare cron worker (infra/cron-worker), a minute after each half hour in the hours games
# are on, so its database read shares an awake period the sports crons already open. GitHub's own schedule started 10-25 minutes
# late and woke Neon on its own.
#
# This workflow stays for two things:
# - The alert. When the Cloudflare check fails it dispatches this workflow with `alert` set. The run fails at once, without a
#   checkout, and GitHub's failed-run email is the notification.
# - A manual check. Run it from the Actions tab with `alert` empty: it calls /api/sports/live/health itself. Needs the repository
#   secret CRON_SECRET and, optionally, the variable APP_URL (default https://www.peerfolio.org).
on:
  workflow_dispatch:
    inputs:
      alert:
        description: "Set by the Cloudflare watchdog: the failure summary. Leave empty for a manual health check."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  alert:
    if: ${{ inputs.alert != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Live odds watchdog failed
        env:
          SUMMARY: ${{ inputs.alert }}
        run: |
          echo "$SUMMARY"
          echo "Live odds watchdog failed. Check Admin > Sports health and the Live odds worker workflow."
          exit 1

  watchdog:
    if: ${{ inputs.alert == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check live odds health
        working-directory: apps/web
        env:
          APP_URL: ${{ vars.APP_URL || 'https://www.peerfolio.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node --experimental-strip-types scripts/check-live-health.mts
